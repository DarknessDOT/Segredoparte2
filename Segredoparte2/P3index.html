      <p style="font-size: 26px; height: 0cm;">(anagrama)</p>
      <p>Pico Golias</p>
      <input type="text" id="nomeInput" placeholder="Resposta">

        <p id="mensagem"></p>
        <script>
            function verificarNome() {
            const nome = document.getElementById("nomeInput").value; 
                                         
            if (nome.toLowerCase() === "psicologia") {
                document.getElementById("mensagem").textContent = "O que a menina da cidade mais gosta quando está junto com o batman?";
